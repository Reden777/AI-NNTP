<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI·NNTP Reader</title>
  <style>
    :root { color-scheme: dark; --bg:#10120f; --panel:#171a16; --line:#30362d; --text:#e8eadf; --muted:#969d8e; --accent:#b8e986; --ai:#202b1d; --user:#1c201c; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    button,input,textarea { font:inherit } button { cursor:pointer }
    .shell { display:grid; grid-template-columns:310px minmax(0,1fr); height:100vh }
    aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto }
    header { padding:20px; border-bottom:1px solid var(--line) }
    h1 { margin:0; font-size:18px; letter-spacing:.08em } .group,.meta,.empty { color:var(--muted); font-size:12px }
    .group { margin-top:4px } #threads { padding:8px }
    .thread { width:100%; border:0; border-left:3px solid transparent; background:none; color:inherit; padding:12px; text-align:left; border-radius:3px; margin-bottom:3px }
    .thread:hover,.thread.active { background:#22261f; border-left-color:var(--accent) }
    .thread-title { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .thread-meta { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; margin-top:5px }
    main { min-width:0; display:flex; flex-direction:column }
    .toolbar { min-height:65px; padding:14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:15px }
    #title { margin:0; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .primary { border:1px solid var(--accent); background:var(--accent); color:#13200d; padding:8px 13px; border-radius:3px; font-weight:700 }
    .secondary { border:1px solid var(--line); background:transparent; color:var(--text); padding:7px 11px; border-radius:3px }
    #conversation { flex:1; overflow:auto; padding:28px max(24px,calc((100% - 820px)/2)); }
    article { border:1px solid var(--line); background:var(--user); border-radius:5px; padding:18px; margin-bottom:16px }
    article.ai { background:var(--ai); border-color:#3b5033 }
    .article-head { display:flex; justify-content:space-between; gap:15px; margin-bottom:12px; color:var(--muted); font-size:12px }
    .author { color:var(--accent) } .body { white-space:pre-wrap; overflow-wrap:anywhere }
    .reply { margin-top:14px; opacity:.7 } article:hover .reply { opacity:1 }
    dialog { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; width:min(650px,calc(100% - 30px)); padding:0; box-shadow:0 20px 70px #000a }
    dialog::backdrop { background:#0009 } form { padding:22px } form h2 { margin:0 0 18px; font-size:17px }
    label { display:block; color:var(--muted); margin:12px 0 5px; font-size:12px } input,textarea { width:100%; color:var(--text); background:#0d0f0c; border:1px solid var(--line); border-radius:3px; padding:10px }
    textarea { min-height:210px; resize:vertical } .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px }
    #status { position:fixed; right:18px; bottom:18px; background:#252a22; border:1px solid var(--line); padding:9px 13px; border-radius:3px; display:none }
    .thinking { color:var(--accent); padding:8px 2px; animation:pulse 1.4s infinite } @keyframes pulse { 50% { opacity:.45 } }
    @media(max-width:700px) { .shell { grid-template-columns:1fr } aside { display:none } #conversation { padding:18px 12px } }
  </style>
</head>
<body>
<div class="shell">
  <aside><header><h1>AI·NNTP</h1><div class="group">ai.text / conversations</div></header><div id="threads"></div></aside>
  <main><div class="toolbar"><h2 id="title">Select a conversation</h2><button class="primary" id="new">+ New post</button></div><section id="conversation"><div class="empty">No posts yet. Start a conversation with the model.</div></section></main>
</div>
<dialog id="composer"><form id="form"><h2 id="compose-title">New conversation</h2><input type="hidden" id="reply-to"><label for="name">Display name</label><input id="name" maxlength="100" placeholder="Anonymous"><label for="subject">Subject</label><input id="subject" maxlength="200" required><label for="message">Message</label><textarea id="message" maxlength="1048576" required autofocus></textarea><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" id="send">Post</button></div></form></dialog>
<div id="status"></div>
<script>
  const $ = s => document.querySelector(s); let articles=[], active=null, posting=false;
  const escapeHTML = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML };
  const displayFrom = s => (s||'Unknown').replace(/\s*<[^>]+>\s*$/, '');
  const relative = date => { const n=(Date.now()-new Date(date))/1000; if(n<60)return 'now'; if(n<3600)return Math.floor(n/60)+'m'; if(n<86400)return Math.floor(n/3600)+'h'; return Math.floor(n/86400)+'d' };
  function threads(){ const map=new Map; for(const a of articles){ if(!map.has(a.threadId))map.set(a.threadId,[]); map.get(a.threadId).push(a) } return [...map.values()].sort((a,b)=>new Date(b.at(-1).date)-new Date(a.at(-1).date)) }
  function render(){ const groups=threads(); if(active&&!groups.some(g=>g[0].threadId===active))active=null; if(!active&&groups.length)active=groups[0][0].threadId;
    $('#threads').innerHTML=groups.map(g=>`<button class="thread ${g[0].threadId===active?'active':''}" data-id="${escapeHTML(g[0].threadId)}"><span class="thread-title">${escapeHTML(g[0].subject.replace(/^re:\s*/i,''))}</span><span class="thread-meta"><span>${g.length} post${g.length===1?'':'s'}</span><span>${relative(g.at(-1).date)}</span></span></button>`).join('') || '<div class="empty" style="padding:15px">No conversations</div>';
    document.querySelectorAll('.thread').forEach(x=>x.onclick=()=>{active=x.dataset.id;render()}); const group=groups.find(g=>g[0].threadId===active);
    if(!group){$('#title').textContent='Select a conversation';$('#conversation').innerHTML='<div class="empty">No posts yet. Start a conversation with the model.</div>';return}
    $('#title').textContent=group[0].subject.replace(/^re:\s*/i,''); const last=group.at(-1);
    const replyStatus=last.replyState==='pending'?'<div class="thinking">◆ The model is composing a reply…</div>':last.replyState==='failed'?'<div class="empty">The model could not reply. Check the server log, then reply to retry.</div>':'';
    $('#conversation').innerHTML=group.map(a=>`<article class="${a.ai?'ai':''}"><div class="article-head"><span class="author">${a.ai?'◆ ':''}${escapeHTML(displayFrom(a.from))}</span><time title="${escapeHTML(new Date(a.date).toLocaleString())}">${relative(a.date)}</time></div><div class="body">${escapeHTML(a.body)}</div><button class="secondary reply" data-reply="${escapeHTML(a.messageId)}" data-subject="${escapeHTML(a.subject)}">Reply</button></article>`).join('')+replyStatus;
    document.querySelectorAll('.reply').forEach(x=>x.onclick=()=>openComposer(x.dataset.reply,x.dataset.subject)); $('#conversation').scrollTop=$('#conversation').scrollHeight;
  }
  async function refresh(){ try{const r=await fetch('/api/articles',{cache:'no-store'});if(!r.ok)throw Error('Could not load articles');const next=await r.json();if(JSON.stringify(next)!==JSON.stringify(articles)){articles=next;render()}}catch(e){toast(e.message)} }
  function openComposer(reply='',subject=''){ $('#reply-to').value=reply;$('#compose-title').textContent=reply?'Reply to conversation':'New conversation';$('#subject').value=reply?(subject.match(/^re:/i)?subject:'Re: '+subject):'';$('#message').value='';$('#name').value=localStorage.getItem('ai-nntp-name')||'';$('#composer').showModal();setTimeout(()=>$(reply?'#message':'#subject').focus(),0) }
  function toast(text){const x=$('#status');x.textContent=text;x.style.display='block';clearTimeout(x.timer);x.timer=setTimeout(()=>x.style.display='none',3500)}
  $('#new').onclick=()=>openComposer();$('#cancel').onclick=()=>$('#composer').close();$('#form').onsubmit=async e=>{e.preventDefault();if(posting)return;posting=true;$('#send').disabled=true;const payload={name:$('#name').value,subject:$('#subject').value,body:$('#message').value,replyTo:$('#reply-to').value};localStorage.setItem('ai-nntp-name',payload.name);try{const r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.error||'Post failed');$('#composer').close();await refresh();const item=articles.find(a=>a.messageId===data.messageId);if(item)active=item.threadId;render();toast('Posted to ai.text')}catch(e){toast(e.message)}finally{posting=false;$('#send').disabled=false}};
  refresh();setInterval(refresh,2500);
</script>
</body>
</html>
